name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests (${{ matrix.database }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, postgres]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: voiceops
          POSTGRES_PASSWORD: voiceops
          POSTGRES_DB: voiceops_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U voiceops"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      HF_HOME: ${{ github.workspace }}/.cache/huggingface
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        # CPU-only PyTorch, same as the Dockerfile
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.13.0
          pip install -r requirements-dev.txt

      - name: Cache embedding model
        uses: actions/cache@v6
        with:
          path: ${{ env.HF_HOME }}
          key: hf-all-MiniLM-L6-v2

      - name: Run tests
        env:
          TEST_DATABASE_URL: ${{ matrix.database == 'postgres' && 'postgresql+asyncpg://voiceops:voiceops@localhost:5432/voiceops_test' || '' }}
        run: |
          if [ -z "$TEST_DATABASE_URL" ]; then unset TEST_DATABASE_URL; fi
          pytest

  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build
